<script>
/* ---------- ข้อมูลสมมติ (ไม่ใช่ข้อมูลจริง) ---------- */
const TYPES={W:'ทำงานปกติ',O1:'OT วันปกติ',S:'ทำงานวันอาทิตย์',O2:'OT วันอาทิตย์',H:'ทำงานวันหยุด',O3:'OT วันหยุด'};
const LEAVE={1:'ลากิจ',2:'ลาป่วย (มีใบแพทย์)',3:'ลาป่วย (ไม่มีใบแพทย์)',4:'ลาคลอด',5:'อุบัติเหตุในงาน',6:'ลาพักร้อน',7:'ลาอื่นๆ',8:'ขาดงาน',9:'ลากิจฉุกเฉิน',11:'ฝึกอบรม',13:'ลากิจไม่แจ้งล่วงหน้า',14:'ลากิจเกินกำหนด'};
const EMP=[
 {id:'D010',name:'นายสมชาย ใจดี',dep:'ไดคาสท์',clas:'รายวัน',rate:420,start:'2015-03-02',sex:'M'},
 {id:'D385',name:'นางสาวมาลี ศรีสุข',dep:'ไดคาสท์',clas:'รายวัน',rate:380,start:'2021-06-14',sex:'F'},
 {id:'T112',name:'นายประเสริฐ ทองคำ',dep:'ตกแต่ง',clas:'รายวัน',rate:400,start:'2018-01-08',sex:'M'},
 {id:'T204',name:'นางวันเพ็ญ แก้วมณี',dep:'ตกแต่ง',clas:'รายวัน',rate:372,start:'2026-02-02',sex:'F'},
 {id:'B179',name:'นายณรงค์ พึ่งบุญ',dep:'อัดผ้าเบรก',clas:'รายวัน',rate:410,start:'2012-07-16',sex:'M'},
 {id:'B241',name:'นางสาวจันทร์เพ็ญ อินทร์แก้ว',dep:'อัดผ้าเบรก',clas:'รายวัน',rate:380,start:'2023-09-04',sex:'F'},
 {id:'G033',name:'นายวิชัย บุญมา',dep:'ฝนผ้าเบรก',clas:'รายวัน',rate:395,start:'2019-11-11',sex:'M'},
 {id:'A057',name:'นางสมศรี มีสุข',dep:'ประกอบ',clas:'รายวัน',rate:390,start:'2017-04-03',sex:'F'},
 {id:'P178',name:'นางสาวอรุณี แสงทอง',dep:'บรรจุ',clas:'รายวัน',rate:372,start:'2024-05-20',sex:'F'},
 {id:'M021',name:'นายสุรศักดิ์ ช่างดี',dep:'ซ่อมบำรุง',clas:'รายเดือน',rate:700,start:'2010-02-01',sex:'M'},
 {id:'O004',name:'นางรำไพ วงศ์ใหญ่',dep:'บุคคลและธุรการ',clas:'รายเดือน',rate:620,start:'2009-08-17',sex:'F'}
];
const P={from:new Date(2026,10,12),to:new Date(2026,10,26),pay:new Date(2026,11,1)}; // งวด 12–26 พ.ย. 2569 จ่าย 1 ธ.ค. 2569
const DAYS=[];for(let d=new Date(P.from);d<=P.to;d.setDate(d.getDate()+1))DAYS.push(new Date(d));
const isSun=d=>d.getDay()===0;
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const th=(d,y=true)=>d.getDate()+'/'+(d.getMonth()+1)+(y?'/'+(d.getFullYear()+543):'');
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
/* เวลาทำงานตัวอย่าง: key = id|date → [{type,in,out,rest}] ; absent = ไม่มาทำงาน */
const WORK={},ABSENT={};
EMP.forEach((e,i)=>DAYS.forEach((d,j)=>{
  const k=e.id+'|'+dk(d);
  if(isSun(d)){ if(i%4===0) WORK[k]=[{type:'S',in:'08:00',out:'17:00',rest:60}]; return;}
  if((i*7+j)%23===5){ABSENT[k]='ไม่มา';return;}
  if(d>new Date(2026,10,20)) return; // วันที่ยังไม่ได้บันทึก
  const r=[{type:'W',in:(i*3+j)%17===4?'08:25':'08:00',out:'17:00',rest:60}];
  if((i+j)%3===0) r.push({type:'O1',in:'17:20',out:'20:10',rest:0});
  WORK[k]=r;
}));
const LV={'D385':[{from:'2026-03-09',to:'2026-03-10',days:2,sr:2,sal:'Y',rem:'ไข้หวัด'},{from:'2026-06-22',to:'2026-06-26',days:5,sr:1,sal:'Y',rem:'ธุระที่บ้าน'},{from:'2026-11-17',to:'2026-11-17',days:1,sr:8,sal:'N',rem:''}],
 'D010':[{from:'2026-04-13',to:'2026-04-17',days:5,sr:6,sal:'Y',rem:'สงกรานต์'}]};
/* ---------- ตัวช่วย ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const mins=(a,b)=>{const[h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let x=h2*60+m2-(h1*60+m1);if(x<0)x+=1440;return x};
const hrs=r=>Math.max(0,(mins(r.in,r.out)-(r.rest||0))/60);
const cellCode=(e,d)=>{const k=e.id+'|'+dk(d);const lv=(LV[e.id]||[]).find(l=>l.from<=dk(d)&&l.to>=dk(d));
  if(lv)return{c:'L',t:'ลา',lv};if(ABSENT[k])return{c:'X',t:'ขาด'};const w=WORK[k];if(!w)return{c:'',t:'·'};
  if(w.some(r=>r.type==='S'||r.type==='H'))return{c:'S',t:w.length>1?'S+':'S'};return w.length>1?{c:'OT',t:'W+'}:{c:'W',t:w[0].in>'08:00'?'สาย':'W'}};
function used(id,srs){return(LV[id]||[]).filter(l=>l.sal==='Y'&&srs.includes(+l.sr)).reduce((a,l)=>a+ +l.days,0)}
function checkQuota(e,sr,days,sal){ // BR-020 แบบย่อ (ตัวอย่าง)
  sr=+sr;days=+days;if(sal!=='Y')return null;
  const tenure=(new Date()-new Date(e.start))/864e5;
  if([7,8,13,14,15].includes(sr))return 'ไม่สามารถบันทึกได้ เนื่องจากเป็นการลาที่ไม่ได้ค่าแรง';
  if([1,9].includes(sr)&&used(e.id,[1,9])+days>6)return 'ไม่สามารถบันทึกได้ เนื่องจากลากิจได้ค่าแรงเกิน 6 วัน';
  if([2,3].includes(sr)&&used(e.id,[2,3])+days>30)return 'ไม่สามารถบันทึกได้ เนื่องจากลาป่วยได้ค่าแรงเกิน 30 วัน';
  if(sr===6&&tenure<365)return 'ไม่สามารถบันทึกได้ เนื่องจากยังไม่มีพักร้อน';
  if(sr===6&&used(e.id,[6])+days>12)return 'ไม่สามารถบันทึกได้ เนื่องจากลาพักร้อนเกิน 12 วัน';
  if(sr===4&&e.sex!=='F')return 'ไม่สามารถบันทึกได้ เนื่องจากเพศชายลาคลอดไม่ได้';
  return null}
const typeSel=(v,attr='')=>`<select ${attr}>${Object.entries(TYPES).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${k} · ${n}</option>`).join('')}</select>`;

/* ---------- หน้า "เวลาทำงานและการลา" ---------- */
const TIME={
 a:{name:'รายคน (แบบฟอร์ม + ตารางย่อยเหมือน Access)',render:timeA},
 b:{name:'รายวัน (ทั้งโรงงานในวันเดียว)',render:timeB},

   ${list.map((e,ri)=>{const k=e.id+'|'+selDay,w=WORK[k]||[],r=w.find(x=>!x.type.startsWith('O')),o=w.find(x=>x.type.startsWith('O'));const[s,c]=st(e);

     <td>${r?typeSel(r.type,`data-f="${e.id}|type" data-r="${ri}"`):'<span class="hint">–</span>'}</td>

     <td class="num mono">${r?r.rest:''}</td>
     <td><input class="mono" data-ot="${e.id}|in" data-r="${ri}" value="${o?o.in:''}" placeholder="—" ${r?'':'disabled'}></td><td><input class="mono" data-ot="${e.id}|out" data-r="${ri}" value="${o?o.out:''}" placeholder="—" ${r?'':'disabled'}></td>
     <td class="num mono">${w.reduce((a,x)=>a+hrs(x),0).toFixed(2)}</td></tr>`}).join('')}
  </tbody></table></div>
  <div class="pad hint">คีย์บอร์ด: <span class="kbd">Enter</span> ลงแถวถัดไปในคอลัมน์เดิม · <span class="kbd">Tab</span> ไปช่องถัดไป · ใส่เวลา OT เริ่มแล้วระบบเติมเวลาเลิกตามกะ (17:20–20:10)</div></div>`;

  m.querySelectorAll('[data-st]').forEach(s=>s.onchange=()=>{const k=s.dataset.st+'|'+selDay;if(s.value==='ไม่มา'){ABSENT[k]='ไม่มา';delete WORK[k]}else{delete ABSENT[k];WORK[k]=WORK[k]||[{type:'W',in:'08:00',out:'17:00',rest:60}]}render()});

   ()=>payTable(),()=>bankBox(),()=>slipBox()][cstep]();
  m.innerHTML=`<h1>ปิดงวดค่าแรง (ตัด WEEK)</h1><p class="sub">งวด ${th(P.from,false)}–${th(P.to)} · จ่าย ${th(P.pay)} — ทำตามลำดับทีละขั้น ย้อนกลับได้</p>
  <div class="stepper">${STEPS.map((s,i)=>`<div class="step ${i===cstep?'on':''} ${cdone[i]&&i!==cstep?'done':''}"><span class="dot">${cdone[i]&&i!==cstep?'✓':i+1}</span>${s}</div>`).join('')}</div>
  <div class="paper pad">${body}
   <div class="row" style="margin-top:16px"><button type="button" class="btn" id="back" ${cstep===0?'disabled':''}>ย้อนกลับ</button><span class="grow"></span>
   ${cstep<4?`<button type="button" class="btn pri" id="fwd">${['ยืนยันงวดนี้','ยืนยันเวลาทำงาน','ยืนยันยอดค่าแรง','เสร็จ ไปขั้นถัดไป'][cstep]}</button>`:'<button type="button" class="btn pri" id="fin">ปิดงวด</button>'}</div></div>`;

  m.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
}

   {t:'พิมพ์สรุปค่าแรง',d:'ค่าแรงทั่วไป',btn:'พิมพ์',menu:'RPT-03'},
   {t:'ค่าแรงส่งแบงค์',d:'ttb (ค่าแรง) และกสิกร (OT)',btn:'สร้างไฟล์',menu:'SCR-42 / RPT-05'},

  <div class="paper pad" style="margin-bottom:12px"><div class="row"><b>งวด ${th(P.from,false)}–${th(P.to)}</b><span class="chip ${cdone.slice(0,6).every(Boolean)?'c-ok':'c-info'}">${cdone.slice(0,6).filter(Boolean).length}/6 ขั้น</span><span class="grow"></span><span class="hint">ผู้ทำล่าสุด: hr01 · 20/11/2569 16:42</span></div></div>
  <div class="checklist">${items.map((it,i)=>{const done=cdone[i],ready=!done&&(i===0||cdone[i-1]);return `<div class="ck ${done?'done':ready?'ready':'locked'}"><span class="st">${done?'✓':i+1}</span>
    <div style="min-width:0"><b>${it.t}</b> <span class="hint">${it.menu}</span><div class="hint">${it.d}</div>${i===2&&done?`<details style="margin-top:8px"><summary class="hint">ดูยอดค่าแรง</summary>${payTable()}</details>`:''}</div>
    <button type="button" class="btn ${ready?'pri':'out'}" data-ck="${i}" ${!ready&&!done?'disabled':''}>${done?'ทำซ้ำ':it.btn}</button></div>`}).join('')}</div>`;
  m.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ck;cdone[i]=true;toast(items[i].t+' — เสร็จ (ต้นแบบ)');render()});
}

/* ---------- route + switcher ---------- */
const PAGES={time:TIME,close:CLOSE};
let page='time',vari='a';
function readHash(){const h=(location.hash||'').slice(1).match(/^(time|close)-([abc])$/);if(h&&PAGES[h[1]][h[2]]){page=h[1];vari=h[2]}}
function render(){
  const pv=PAGES[page];if(!pv[vari])vari='a';
  document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));
  const keys=Object.keys(pv);$('#vlabel').innerHTML=`<b>${vari.toUpperCase()}</b> / ${keys.length} · ${pv[vari].name}`;
  const y=window.scrollY;pv[vari].render($('#main'));window.scrollTo(0,y);
}
function go(p,v){page=p;vari=v;try{history.replaceState(null,'','#'+p+'-'+v)}catch(e){location.hash=p+'-'+v}render()}
function cycle(n){const k=Object.keys(PAGES[page]);go(page,k[(k.indexOf(vari)+n+k.length)%k.length])}
$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);
document.addEventListener('keydown',ev=>{const t=ev.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;if(ev.key==='ArrowLeft')cycle(-1);if(ev.key==='ArrowRight')cycle(1)});
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page,'a'));
window.addEventListener('hashchange',()=>{readHash();render()});
readHash();render();
</script>
